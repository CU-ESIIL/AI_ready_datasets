<text x="170" y="123" text-anchor="middle" fill="#183d34" font-family="sans-serif" font-size="17"><tspan x="170" dy="0">Structural: cell / organ</tspan></text>
<rect x="340" y="85" width="280" height="64" rx="4" fill="white" stroke="#9fb4a5"/>
<text x="480" y="113" text-anchor="middle" fill="#183d34" font-family="sans-serif" font-size="17"><tspan x="480" dy="0">Ecological: population /</tspan><tspan x="480" dy="20">community</tspan></text>
