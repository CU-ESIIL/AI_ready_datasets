<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 618" role="img" aria-labelledby="title desc">
<title id="title">Intersecting organizations of biology</title><desc id="desc">Conceptual perspectives, not a universal ladder. No shared is-a or containment relation is asserted.</desc>
